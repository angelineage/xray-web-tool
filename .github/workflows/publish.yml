name: Publish Xray Web Tool
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing verified version tag
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Select immutable release tag
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then RELEASE_TAG="$REQUESTED_TAG"; elif [[ "$GITHUB_REF" == refs/tags/* ]]; then RELEASE_TAG="$GITHUB_REF_NAME"; else RELEASE_TAG="$(git describe --tags --abbrev=0)"; fi
          printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          git checkout --detach "$RELEASE_TAG"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_ui.cjs
      - run: if [ -f tests/test_dashboard.cjs ]; then node tests/test_dashboard.cjs; fi
      - run: node tests/test_probe.cjs
      - run: python tools/build.py
      - name: Publish verified tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$RELEASE_TAG" = "v$(python -c 'import json; print(json.load(open("maintenance.json"))["version"])')"
          VERSION="${RELEASE_TAG#v}"
          git archive --format=tar.gz --prefix=xray-web-tool/ -o "dist/xray-web-tool-source-${VERSION}.tar.gz" HEAD
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Xray Web Tool ${RELEASE_TAG}" --notes-file CHANGELOG.md
          for ASSET in "dist/xray_web_tool_arm_lite_ac3100_${VERSION}.tar.gz" "dist/xray-web-tool-source-${VERSION}.tar.gz" dist/SHA256SUMS.txt dist/build-manifest.json; do
            NAME="${ASSET##*/}"
            EXPECTED="sha256:$(sha256sum "$ASSET" | cut -d' ' -f1)"
            VERIFIED=0
            for ATTEMPT in 1 2 3; do
              if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-assets.json"; then sleep 2; continue; fi
              ACTUAL=$(jq -r --arg name "$NAME" '.assets[] | select(.name==$name) | .digest // empty' "$RUNNER_TEMP/release-assets.json")
              if [ "$ACTUAL" = "$EXPECTED" ]; then VERIFIED=1; echo "$NAME already verified"; break; fi
              if jq -e --arg name "$NAME" 'any(.assets[]; .name==$name)' "$RUNNER_TEMP/release-assets.json" >/dev/null; then echo "Existing asset differs: $NAME"; exit 1; fi
              gh release upload "$RELEASE_TAG" "$ASSET" || true
            done
            if [ "$VERIFIED" != 1 ]; then
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-assets.json"
              ACTUAL=$(jq -r --arg name "$NAME" '.assets[] | select(.name==$name) | .digest // empty' "$RUNNER_TEMP/release-assets.json")
              test "$ACTUAL" = "$EXPECTED"
            fi
          done
