name: Sync rule lists

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rule-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Generate and validate rules
        run: python tools/update_rules.py --apply
      - name: Run maintenance tests
        run: python -m unittest discover -s tests -v
      - name: Publish changed rules
        run: |
          if git diff --quiet -- src/shadowsocks/ss/rules/gfwlist.gz src/shadowsocks/ss/rules/chnlist.gz src/shadowsocks/ss/rules/chnroute.txt; then
            echo "Rule contents are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shadowsocks/ss/rules/gfwlist.gz src/shadowsocks/ss/rules/chnlist.gz src/shadowsocks/ss/rules/chnroute.txt src/shadowsocks/ss/rules/rules.json.js rules-provenance.json
          git commit -m "Update rule lists"
          git push origin HEAD:main

