name: Build AC3100 arm_lite
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_ui.cjs
      - run: node tests/test_probe.cjs
      - run: python tools/build.py
      - name: Include reviewed source
        run: git archive --format=tar.gz --prefix=fancyss-ac3100/ -o dist/fancyss-ac3100-source.tar.gz HEAD
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: fancyss-ac3100
          path: dist/
